services:
  db:
    image: postgres:16-alpine
    container_name: coliving-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coliving
    ports:
      # 5434 host để chạy song song với các dự án khác (hai=5432, phonestore=5433)
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coliving"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: coliving-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-minioadmin}"
    ports:
      - "9004:9000"   # API (ảnh phục vụ tại http://localhost:9004/<bucket>/<file>)
      - "9005:9001"   # Console quản trị
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: coliving-api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=coliving;Username=postgres;Password=postgres"
      Minio__Endpoint: "minio:9000"
      Minio__PublicEndpoint: "${MINIO_PUBLIC_URL:-http://localhost:9004}"
      Minio__AccessKey: "${MINIO_USER:-minioadmin}"
      Minio__SecretKey: "${MINIO_PASSWORD:-minioadmin}"
      Minio__Bucket: "coliving"
      Minio__UseSsl: "false"
      Jwt__Secret: "${JWT_SECRET:-CHANGE_ME_super_secret_key_at_least_32_chars_long_1234567890}"
      Jwt__Issuer: "ColivingAPI"
      Jwt__Audience: "ColivingClient"
      Cors__Origins__0: "http://localhost:5175"
      Seed__Admin__Email: "${ADMIN_EMAIL:-admin@coliving.local}"
      Seed__Admin__Password: "${ADMIN_PASSWORD:-Admin@123}"
      Seed__SeedDemoData: "true"
      VnPay__TmnCode: "${VNPAY_TMNCODE:-YOUR_TMNCODE}"
      VnPay__HashSecret: "${VNPAY_HASHSECRET:-YOUR_HASHSECRET}"
      VnPay__BaseUrl: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VnPay__ReturnUrl: "http://localhost:8082/api/payments/vnpay/return"
      VnPay__FrontendReturnUrl: "http://localhost:5175/payment/result"
      VnPay__MockUrl: "http://localhost:5175/payment/mock"
      VnPay__Version: "2.1.0"
      VnPay__Locale: "vn"
      # Email: mặc định "Log" (ghi console, không cần SMTP). Đổi EMAIL_PROVIDER=Smtp + điền SMTP_* để gửi thật.
      Email__Provider: "${EMAIL_PROVIDER:-Log}"
      Email__FromName: "Coliving"
      Email__FromEmail: "${EMAIL_FROM:-no-reply@coliving.local}"
      Email__Host: "${SMTP_HOST:-}"
      Email__Port: "${SMTP_PORT:-587}"
      Email__Username: "${SMTP_USER:-}"
      Email__Password: "${SMTP_PASS:-}"
      Email__EnableSsl: "${SMTP_SSL:-true}"
      Email__AppBaseUrl: "${APP_BASE_URL:-http://localhost:5175}"
    ports:
      - "8082:8080"

  web:
    build:
      context: ./frontend
    container_name: coliving-web
    depends_on:
      - api
    ports:
      - "5175:80"

volumes:
  pgdata:
  minio_data:
