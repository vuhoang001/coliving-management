name: CI

# Kiểm tra build backend (.NET 8) và frontend (Vue 3) mỗi khi push hoặc mở PR.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Build Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Coliving.sln
        working-directory: backend
      - name: Build
        run: dotnet build Coliving.sln --no-restore -c Release
        working-directory: backend
      - name: Test
        run: dotnet test Coliving.sln --no-build -c Release --verbosity normal
        working-directory: backend

  frontend:
    name: Build Frontend (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: frontend
      - name: Type-check & build
        run: npm run build
        working-directory: frontend
