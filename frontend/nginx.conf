server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html KHÔNG cache → mỗi lần tải trang luôn lấy bản mới
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Asset có hash trong tên → cache vĩnh viễn
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: mọi route trả về index.html cho Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy các lời gọi /api sang backend service trong docker network
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m; # cho phép upload ảnh tối đa ~5MB
    }

    # SignalR hub (WebSocket) — cần nâng cấp kết nối HTTP → WS
    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s; # giữ kết nối realtime lâu dài
    }

    # Ảnh lưu local do API phục vụ (seed + user upload)
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
